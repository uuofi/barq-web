name: Website CI/CD

# Test on every push/PR; build + deploy only on main.
# Mirrors delivery-backend/.github/workflows/backend.yml's shape (same
# VPS_HOST/VPS_USER/VPS_SSH_KEY/VPS_PORT secrets, same test → build → deploy
# staging) — this is a separate GitHub repo for the website, deployed to the
# same VPS as the backend but to its own CloudPanel static-site vhost. See
# DEPLOYMENT.md for the one-time server setup this workflow assumes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1) Test ───────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # ── 2) Build the static bundle + deploy to the VPS (main only) ────────────
  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Every VITE_* value ends up inlined into the shipped JS bundle — see
      # .env.example. These are GitHub Actions Variables (public), never
      # Secrets: there is nothing here a browser can't already read.
      - name: Build (sitemap + typecheck + vite build)
        run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_APP_STORE_URL: ${{ vars.VITE_APP_STORE_URL }}
          VITE_PLAY_STORE_URL: ${{ vars.VITE_PLAY_STORE_URL }}
          VITE_APK_DOWNLOAD_URL: ${{ vars.VITE_APK_DOWNLOAD_URL }}
          VITE_CONTACT_PHONE: ${{ vars.VITE_CONTACT_PHONE }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          VITE_ANALYTICS_ID: ${{ vars.VITE_ANALYTICS_ID }}
          VITE_FEATURE_ORDER_TRACKING: ${{ vars.VITE_FEATURE_ORDER_TRACKING }}
          VITE_FEATURE_LEAD_FORMS: ${{ vars.VITE_FEATURE_LEAD_FORMS }}

      # Mirrors the built dist/ folder onto the VPS document root over SSH.
      # --delete removes assets from a previous build whose content hash
      # changed — a stale hashed chunk left behind is harmless but is still
      # dead weight on disk.
      - name: Sync dist/ to the VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: ${{ secrets.WEBSITE_DEPLOY_PATH }}
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: ${{ secrets.VPS_PORT || 22 }}
