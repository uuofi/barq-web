<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0A0D10" />

    <!--
      These are DEFAULTS only. Every route overrides title/description/canonical
      at runtime through <Seo /> (src/components/seo/Seo.tsx). Keep them generic
      so a crawler that never runs JS still gets something meaningful.
    -->
    <title>برق — سريع. آمن. موثوق</title>
    <meta name="description" content="منصة برق للتوصيل — اطلب سائقاً، أدر متجرك، وتابع طلباتك لحظة بلحظة." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applies the stored language direction before first paint so an English
      // visitor never sees an RTL flash. Must stay in sync with
      // readStoredLanguage() in src/i18n/index.ts.
      (function () {
        try {
          var lang = localStorage.getItem('albarq.site.lang');
          if (lang === 'en') {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
          }
        } catch (e) {
          /* storage blocked (private mode) — keep the Arabic RTL default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
